[project]
name = "alphaosint-prospector"
version = "0.1.0"
description = "B2B prospecting inside Claude: source accounts from hiring signals, enrich with LinkedIn and Crunchbase data, score against your ICP, find decision-makers and verified emails."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "John Cole", email = "29712567+johnisanerd@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
    "apify-client>=3.0,<4",
    "mcp[cli]>=2.0,<3",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
alpha-prospector = "alpha_prospector.cli:main"

[project.urls]
Homepage = "https://alphaosint.com"
Repository = "https://github.com/johnisanerd/alphaosint-prospector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_prospector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
